name: Build and Check

on:
  push:
    branches:
      - main
      - cluster_structure
  pull_request:


jobs:


  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: '3.13'
    - name: Install prereq using pip
      run: |
        pip install astropy cython
        pip install camb classy jax
        pip install pyinstrument
    - name: Install the package
      run: |
        pip install .
    - name: Run the unit tests
      run: |
        pip install pytest pytest-cov
        pytest tests_cluster/ --cov=cloelib/ --ignore=tests_cluster/benchmark_values.py
      env:
        DISPLAY: test


  check-formatting:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: '3.13'



  check-notebook:
    name: Check notebook
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: '3.13'
    - name: Install prereq using pip
      run: |
        #python -m pip install --upgrade pip
        pip install astropy cython
        pip install camb classy jax
        pip install pyinstrument
        pip install jupyter nbconvert ipykernel
        pip install matplotlib
    - name: Install the package
      run: |
        pip install .
    - name: Download validation data
      run: |
        FILE_ID="1K0CiK3hZ-jBfJOTczvu3BT8G9Bs2Q_ky"
        wget --quiet --save-cookies cookies.txt --keep-session-cookies \
          "https://drive.google.com/uc?export=download&id=${FILE_ID}" -O- \
          | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' \
          | wget --load-cookies cookies.txt \
              "https://drive.google.com/uc?export=download&confirm=\1&id=${FILE_ID}" \
              -O "data.zip"
    - name: Download validation data
      run: |
        unzip data.zip
    - name: Run notebooks
      run: |
        jupyter nbconvert \
          --to notebook \
          --execute \
          --ExecutePreprocessor.timeout=600 \
          --ExecutePreprocessor.kernel_name=python3 \
          notebooks/*.ipynb
