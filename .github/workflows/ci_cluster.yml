name: Build and Check

on:
  push:
    branches:
      - main
      - cluster_structure
  pull_request:

env:
  ENV_NAME: cloe-org-env
  ENV_FILE: cloe-org-environments/environments/cloe-org-env-linux-v2026.1.yaml
jobs:
  style:
    name: Style (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

    needs: style
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout cloe-org-environments
        uses: actions/checkout@v4
        with:
          repository: cloe-org/cloe-org-environments
          path: cloe-org-environments
      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: ${{ env.ENV_NAME }}
          environment-file: ${{ env.ENV_FILE }}
          use-mamba: true
      - name: Install cloelib and extras from pyproject.toml
        run: |
          mamba run -n $ENV_NAME python -m pip install --upgrade pip
          mamba run -n $ENV_NAME python -m pip install ".[camb,classy,euclidemu2,baccoemu,emantis,react,hiclassy]"
      - name: Run tests
        run: mamba run -n $ENV_NAME python -m pytest tests_cluster/ --cov=cloelib/ --ignore=tests_cluster/benchmark_values.py
        env:
          DISPLAY: test

  check-code-version:
    name: Code version number
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/cluster_structure'
    steps:
      # Get current version
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all history
          fetch-tags: true # IMPORTANT: fetch tags too
      - name: Get version from current branch
        id: current_version
        run: |
          CURRENT_VERSION="$(grep -oP '__version__ = "\K[^"]+' cloelib/observables/clusters/__init__.py)"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "my branch is ${{ github.ref }}"
          CLOE_ORG_SHA=$(git merge-base HEAD origin/main)
          CLOE_ORG_SHA=${CLOE_ORG_SHA:0:7}
          echo "Latest main commit: $CLOE_ORG_SHA"
          echo "CLOE_ORG_SHA=$CLOE_ORG_SHA" >> $GITHUB_ENV
          CLOE_ORG_TAG=$(git describe --tags --abbrev=0 $CLOE_ORG_SHA 2>/dev/null || echo "no-tag")
          echo "cloe-org tag: $CLOE_ORG_TAG"
          echo "CLOE_ORG_TAG=$CLOE_ORG_TAG" >> $GITHUB_ENV
      # Get PR title to be updated with version
      - name: Get PR title and clean version number from it
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          NEW_TITLE="${TITLE% [cluster-version:*}"
          echo "New title: $NEW_TITLE"
          echo "NEW_TITLE=$NEW_TITLE" >> $GITHUB_ENV
      - name: Get PR number
        id: pr_number
        run: |
          # Fetch the pull request number from the GitHub context
          PR_NUMBER=$(echo $GITHUB_REF | sed 's/refs\/pull\/\([0-9]*\)\/merge/\1/')
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
      - name: Validate version format
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! echo "$CURRENT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: $v"
            echo "Removing version from PR title: $NEW_TITLE"
            curl -s -X PATCH \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "{\"title\":\"$NEW_TITLE\"}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER" > /dev/null
            exit 1
          fi
          echo "Version format is ok"

      # Get cluster_structure version
      - name: Checkout the cluster_structure branch to get its version
        uses: actions/checkout@v4
        with:
          ref: cluster_structure
      - name: Get version from cluster_structure branch
        id: cluster_structure_version
        run: |
          if [[ "$(git show origin/cluster_structure:cloelib/observables/clusters/__init__.py)" == *"__version__"* ]]; then
            MAIN_VERSION="$(grep -oP '__version__ = "\K[^"]+' cloelib/observables/clusters/__init__.py)"
          else
            echo "No version found at cluster_structure, assuming version 0.0.0"
            MAIN_VERSION="0.0.0"
          fi
          echo "MAIN_VERSION=$MAIN_VERSION" >> $GITHUB_ENV

      # Compare
      - name: Compare versions
        run: |
          IFS=. read -r C1 C2 C3 <<< "$CURRENT_VERSION"
          IFS=. read -r M1 M2 M3 <<< "$MAIN_VERSION"
          if [ "$C1" != "$M1" ]; then
            GOAL="$((M1 + 1)).0.0"
            if [ $C1 -lt $M1 ]; then
              ERROR="  - Version number should increase: $CURRENT_VERSION<$MAIN_VERSION"
            elif [ "$C1" != "$((M1 + 1))" ]; then
              ERROR="  - Increment should be done by 1: $GOAL"
            elif [ "$CURRENT_VERSION" != "$GOAL" ]; then
              ERROR="  - When major version is increased, others should be zero: $GOAL"
            fi
          elif [ "$C2" != "$M2" ]; then
            GOAL="$C1.$((M2 + 1)).0"
            if [ $C2 -lt $M2 ]; then
              ERROR="  - Version number should increase: $CURRENT_VERSION<$MAIN_VERSION"
            elif [ "$C2" != "$((M2 + 1))" ]; then
              ERROR="  - Increments should be done by 1: $GOAL"
            elif [ "$CURRENT_VERSION" != "$GOAL" ]; then
              ERROR="  - When middle version is increased, last number should be zero: $GOAL"
            fi
          elif [ "$C3" != "$M3" ]; then
            GOAL="$C1.$C2.$((M3 + 1))"
            if [ $C3 -lt $M3 ]; then
              ERROR="  - Version number should increase: $CURRENT_VERSION<$MAIN_VERSION"
            elif [ "$CURRENT_VERSION" != "$GOAL" ]; then
              ERROR="  - Increments should be done by 1: $GOAL"
            fi
          else
            ERROR="  - Version at cloelib/observables/clusters/__init__.py has not been updated!"
          fi
          echo "ERROR=$ERROR" >> $GITHUB_ENV

      # Add version number to PR title
      - name: Make new title for PR
        run: |
          if [ "$(printf "%s\n%s" "$CURRENT_VERSION" "$MAIN_VERSION" | sort -V | tail -n 1)" == "$CURRENT_VERSION" ]; then
            NEW_TITLE="${NEW_TITLE} [cluster-version:$CURRENT_VERSION] [cloe-org:$CLOE_ORG_TAG - $CLOE_ORG_SHA]"
            echo "New title: $NEW_TITLE"
            echo "NEW_TITLE=$NEW_TITLE" >> $GITHUB_ENV
          fi
      - name: Update PR title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the GitHub API to update the PR title
          echo "Updating PR #$PR_NUMBER with new title: $NEW_TITLE"
          curl -s -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"title\":\"$NEW_TITLE\"}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER" > /dev/null

      - name: Check version update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$ERROR" != "" ]; then
            echo "Check failed:"
            echo "$ERROR"
            exit 1
          fi
          echo "[ok] Version increased changed!"

  check-notebook:
    name: Check notebook
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.13"
      - name: Install prereq using pip
        run: |
          #python -m pip install --upgrade pip
          pip install astropy cython
          pip install camb classy jax
          pip install pyinstrument
          pip install matplotlib
      - name: Install the package and nb kernel
        run: |
          pip install .
          pip install jupyter nbconvert ipykernel
      - name: Debug python environment
        run: |
          which python
          python --version
          python -c "import sys; print(sys.executable)"
          pip show cloelib
      - name: Download validation data
        working-directory: notebooks
        run: |
          FILE_ID="1K0CiK3hZ-jBfJOTczvu3BT8G9Bs2Q_ky"
          wget --quiet --save-cookies cookies.txt --keep-session-cookies \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}" -O- \
            | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' \
            | wget --load-cookies cookies.txt \
                "https://drive.google.com/uc?export=download&confirm=\1&id=${FILE_ID}" \
                -O "data.zip"
          unzip data.zip
      - name: Run notebooks
        working-directory: notebooks
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.timeout=600 \
            *.ipynb
