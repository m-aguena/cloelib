name: Build and Check

on:
  push:
    branches:
      - main
      - cluster_structure
  pull_request:

jobs:
  build-gcc-ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: '3.13' 
    - name: Install prereq using pip
      run: |
        pip install astropy cython black isort
        pip install camb classy jax
        pip install pyinstrument
    - name: Analysing the code formatting with black
      run: |
        pip install black black-configparser
        black --check --diff cloelib/observables/clusters/
    - name: Analysing the code import order with isort
      run: |
        pip install isort
        isort --check --diff cloelib/observables/clusters/
    - name: Install the package
      run: |
        pip install .
    - name: Run the unit tests
      run: |
        pip install pytest pytest-cov
        pytest tests_cluster/ --cov=cloelib/
      env:
        DISPLAY: test
